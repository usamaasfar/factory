name: Review pull requests

on:
  github.pull_request.opened:
  github.pull_request.synchronize:

agent:
  environment: base.linux
  resources:
    cpu: 2
    memory: 4

  provider: openai
  model: gpt-5.6-sol
  instructions: |
    Review this pull request.

    Inspect the diff and relevant repository context.
    Find correctness, security, and maintainability problems.
    Leave only actionable findings supported by the code.
    Submit the review on the pull request.

    Every delivery is reviewed on its own. You carry nothing from
    an earlier review of this pull request, so review the diff you
    were given rather than referring to findings you cannot see.
