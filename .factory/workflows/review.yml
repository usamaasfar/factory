name: Review pull requests

on:
  github.pull_request.opened:
  github.pull_request.synchronize:

permissions:
  github:
    contents: read
    pull_requests: write
  slack:
    conversations: read
    chat: write

sandbox:
  provider: local
  environment: base.linux
  resources:
    cpu: 2
    memory: 4
    volume: 20

agent:
  provider: openai
  model: gpt-5.6-sol
  instructions: |
    Own the review of this pull request as it evolves.

    Inspect the diff and relevant repository context. Find correctness,
    security, and maintainability problems. Submit only actionable findings
    supported by the code.

    Revisit findings when new commits arrive, avoid duplicate comments, and
    acknowledge resolved issues.
